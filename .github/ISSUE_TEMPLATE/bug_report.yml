name: Bug report
description: Report a reproducible defect
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Include the expected and observed behavior.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction
      description: Provide the smallest safe reproduction without credentials or private data.
    validations:
      required: true
  - type: input
    attributes:
      label: Version and operating system
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, tokens, cookies, and private paths from this report.
          required: true
